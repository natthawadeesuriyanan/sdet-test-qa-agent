name: QA triage and agents

on:
  workflow_run:
    workflows: ["QA nightly"]
    types: [completed]

permissions:
  actions: read
  contents: write
  id-token: write
  issues: write
  pull-requests: write
# These write scopes are needed for issue/branch/PR creation, but also permit
# other write operations via GitHub APIs. Protect the default branch with
# mandatory human review before enabling this workflow on the remote.

concurrency:
  group: qa-triage-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  triage:
    name: Triage failed nightly run
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install Playwright Chromium
        working-directory: ui-tests
        run: mvn test-compile exec:java -e -Dexec.classpathScope=test -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"

      - name: Download nightly evidence when available
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p evidence
          artifact_count="$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '[.artifacts[] | select(.expired == false)] | length')"
          if [ "$artifact_count" -gt 0 ]; then
            gh run download "$RUN_ID" --repo "$REPOSITORY" --dir evidence
          else
            echo "::warning::The nightly run uploaded no artifacts; classifying this as an environment/runner failure."
          fi

      - name: Parse Surefire failures
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p "triage/$RUN_ID"
          python3 .claude/skills/log-analysis/scripts/parse_junit.py evidence \
            --run-id "$RUN_ID" \
            --output "triage/$RUN_ID/failures.json"

      - name: Record upstream job outcomes
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/jobs" \
            --jq '[.jobs[] | {name, conclusion, failed_steps: [.steps[] | select(.conclusion == "failure") | .name]}]' \
            > "triage/$RUN_ID/workflow-jobs.json"

      - name: Summarize Playwright traces
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          python3 .claude/skills/browser-trace/scripts/trace_summary.py evidence \
            --output "triage/$RUN_ID/ui-traces.json"

      - name: Verify Claude API secret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY is required for QA triage. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Ensure QA agent labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "agent:bug" --color "d73a4a" --description "Issue created by QA Bug Reporter" --force
          gh label create "needs-decision" --color "fbca04" --description "Requires human confirmation" --force
          gh label create "agent:fix" --color "1d76db" --description "Draft PR created by QA Test Fixer" --force

      - name: Run Failure Triage, Bug Reporter, and Test Fixer agents
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Run /triage-run ${{ github.event.workflow_run.id }}.
            Explicitly delegate each failed test to the failure-triage subagent.
            For reproducible PRODUCT_BUG handoffs with confidence >= 0.8, delegate to
            bug-reporter to search for duplicates and create a GitHub issue.
            For TEST_DEFECT handoffs with confidence >= 0.8, delegate to test-fixer
            (maximum three) to validate the minimal test-only change and open a draft PR.
            Never merge, close, or confirm issues or PRs. Do not pass or request
            GOREST_API_TOKEN; API tests requiring it cannot be rerun by these agents.
          claude_args: "--max-turns 100"

      - name: Add digest to workflow summary
        if: always()
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          digest="triage/$RUN_ID/digest.md"
          if [ -f "$digest" ]; then
            cat "$digest" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No triage digest was produced. Review the Claude step and uploaded evidence." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload triage handoffs and issue drafts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: qa-triage-${{ github.event.workflow_run.id }}
          path: triage/${{ github.event.workflow_run.id }}/
          if-no-files-found: warn
          retention-days: 30
