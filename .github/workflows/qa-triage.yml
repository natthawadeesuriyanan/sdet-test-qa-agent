name: QA shadow triage

on:
  workflow_run:
    workflows: ["QA nightly"]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: qa-triage-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  triage:
    name: Triage failed nightly run
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download nightly evidence
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          path: evidence

      - name: Parse Surefire failures
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p "triage/$RUN_ID"
          python3 .claude/skills/log-analysis/scripts/parse_junit.py evidence \
            --run-id "$RUN_ID" \
            --output "triage/$RUN_ID/failures.json"

      - name: Summarize Playwright traces
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          python3 .claude/skills/browser-trace/scripts/trace_summary.py evidence \
            --output "triage/$RUN_ID/ui-traces.json"

      - name: Verify Claude API secret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY is required for shadow triage. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Run Claude shadow triage
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "/triage-run ${{ github.event.workflow_run.id }}"
          claude_args: "--max-turns 80 --disallowedTools Bash,Edit"

      - name: Add digest to workflow summary
        if: always()
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          digest="triage/$RUN_ID/digest.md"
          if [ -f "$digest" ]; then
            cat "$digest" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No triage digest was produced. Review the Claude step and uploaded evidence." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload triage handoffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-triage-${{ github.event.workflow_run.id }}
          path: triage/${{ github.event.workflow_run.id }}/
          if-no-files-found: warn
          retention-days: 30
